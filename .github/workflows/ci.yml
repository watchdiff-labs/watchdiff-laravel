name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, pdo, pdo_sqlite, json
          tools: composer:v2
          coverage: none

      # Laravel 10's full release history has at least one unpatched
      # security advisory covering every version, so the PHP 8.1 job (which
      # can only resolve orchestra/testbench 8.x, which needs
      # laravel/framework ^10.0) has no advisory-clean version to install.
      # These are require-dev only (test tooling, never shipped to
      # consumers of this package), so the risk of disabling the block here
      # is scoped to this CI job's own test run, not any real deployment.
      - name: Allow installing packages with open security advisories (require-dev only, see comment above)
        run: composer config -g policy.advisories.block false

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Static analysis
        run: vendor/bin/phpstan analyse src --level 5

      - name: Tests
        run: vendor/bin/phpunit
